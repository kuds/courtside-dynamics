# Campaign map for the run directories that predate experiment specs.
#
# The run index (courtside_dynamics.experiments.index) joins this file
# by run id into each row's `campaign` block. Run records written since
# design L1 carry their own `experiment` block; these runs had none, so
# what each one tested lived only in prose. This file is that prose,
# curated once: the campaign archaeology of 2026-10-16
# (docs/design_campaign_structure_20261016.md), DECISIONS.md and the
# dated review and pre-registration docs.
#
# One table per run directory under `runs`, keyed by the directory's
# name (its run id). Keys:
#   campaign  "paddle_tennis" or "wall_ball"
#   lever     PaddleTennis: the one lever the run tested, "baseline"
#             (a stock-recipe run) or "infra" (a launch with no
#             experiment in it). WallBall: the recipe era, "era/<name>",
#             because that campaign changed several things per recipe.
#   verdict   the lever's (or era's) recorded outcome, with its date
#   doc       the repo doc that names the run; omitted only when no doc
#             does, and then `note` says why
#   note      optional: this run's role within the lever
#
# PaddleTennis: 20 directories, 15 completed runs and 5 aborted
# launches. WallBall: the 27 directories of the five era folders
# (WallBallBaseline, WallBallDepthCurriculum,
# WallBallDepthCurriculumAligned, WallBallGoalRally,
# WallBallTrueBaseline).

