# WallBallGoalServeCurriculum — rally at the campaign-goal geometry
# from step one (constant fence [-4.7, -2.6], paddle start -3.9, serve
# speed 7.0) with a performance-gated serve-origin anneal: the serve
# landing starts ~0.6 m in front of the paddle (origin 0.2, the
# measured crude-learnability peak) and walks back to the true serve
# (origin 1.0) in 0.2 m rungs as eval bounce_count_ep_mean sustains
# >= 2.5 (3-eval window mean). Stages move ONLY the reset
# distribution — no fence slide, no replay clear, no entropy reset, no
# update pause, no pivot drift — and the final rung IS the goal task.
# A rung that stalls 40 evaluations (~1M steps) is force-advanced and
# recorded as unearned (stage_eval_budget_action = "advance"), so the
# run always reaches the true goal serve with budget left to spend.
# Design + evidence: docs/wall_ball_rally_diagnosis_20260728_review.md.
# Usage: build_train_config("WallBallGoalServeCurriculum", log_dir=..., config_file=<this file>)
# Everything here matches the recipe today; edit a value to diverge.
# Do NOT set the serve origin in [env] — the gate owns it. Final
# scoring (eval_info_final.csv, videos, long-horizon audit) runs the
# true goal serve via the recipe's eval_env_overrides; the matched
# selection eval is re-synced to the current rung by the gate.

[train]
total_timesteps = 6_000_000
n_envs = 8
early_stop_patience = 20  # evals without a new best before stopping

[env]
# Lateral spread and speed jitter are fixed across all rungs; only the
# serve origin moves, via the gate. The startup certification sweeps
# every rung with the lead-charge oracle before training begins.
serve_speed_jitter = 0.5
serve_vy_max = 2.0
