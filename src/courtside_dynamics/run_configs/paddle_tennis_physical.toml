# PaddleTennisPhysical — the context-blind pilot arm of PaddleTennis
# (docs/paddle_tennis_physical_pilot_20261005.md; the 2026-10-05 review
# §4.2). Same task as the PaddleTennis starter: 1v1 cooperative rally on
# the probe-frozen 13 m court under ground rules, continuous n-point
# play with the escrowed contact and reach shapings at 0.25 each,
# selection on episode_rally_returns_a, paired evaluation, the
# degenerate guard and the checkpoint diagnosis — all inherited from the
# PaddleTennis recipe unchanged. The declared bundle changes two things
# together:
# - observation_profile = "physical" (recipe env_kwargs, not here): the
#   35-value context-blind policy observation — world-frame ball spin,
#   expected returner / ball side / min(bounce_count, 2) / 2, and the
#   four ball contact channels; the rally-phase one-hot, serving and
#   crossing flags, rally_count and the episode clock are dropped (the
#   bookkeeping the learned policy was measured to gate on,
#   docs/paddle_tennis_prefreeze_diagnostics_20260830.md §4). The raw
#   (un-normalized) tail is indices 24..34.
# - gamma = 0.995 (recipe model_kwargs): at 100 Hz control 0.99 is a
#   ~100-step horizon against ~210 steps between consecutive policy hits.
# The pilot cannot attribute a result to either half alone. Each seed
# runs its full 3M (early-stop patience off, below). Run it
# seeded (SEED = 0 and SEED = 1, one run each): pairing needs the seed,
# and eval_reset_options = "none" opts a seeded run out of pairing.
# Usage: build_train_config("PaddleTennisPhysical", log_dir=..., seed=0, config_file=<this file>)
# Everything here matches the recipe today; edit a value to diverge.
# (docs/run_config_file_spec.md for merge semantics.)

[train]
total_timesteps = 3_000_000
n_envs = 8
# The pilot runs its full budget: patience is off ("none"), unlike the
# PaddleTennis starter's 20 (at eval_freq 25k that can stop a run at
# 1M steps). The degenerate guard stays on in the recipe.
early_stop_patience = "none"
eval_freq = 25_000        # env steps (summed across workers) between evals

# The recipe pins the PaddleTennis exploration package (gSDE with a
# 64-step noise hold, auto-entropy from a raised -1.5 target;
# docs/paddle_tennis_exploration_20260808.md): use_sde=true,
# ent_coef="auto_0.02", target_entropy=-1.5, train_freq=[64, "step"] —
# plus the pilot bundle's gamma = 0.995. Other model kwargs are SB3 SAC
# defaults. Uncomment to tune (deep-merged, so one key at a time is
# safe; changing gamma leaves the declared pilot bundle).
# [train.model_kwargs]
# gamma = 0.995
# learning_rate = 3e-4

# The recipe's per-key selection deltas (a table here REPLACES the
# recipe's whole mapping; keys must be selection keys, missing ones
# mean 0.0). The episode aggregates sit at half their 1/30 granularity
# (0.5 / 30 at 30 eval episodes) so one extra conversion registers;
# rescale them with n_eval_episodes. Uncomment to retune:
# [train.best_metric_min_delta]
# episode_rally_returns_a_ep_mean = 0.016666666666666666
# success_rate = 0.016666666666666666
# episode_reward_mean = 0.25

# [env]
# court_style = "tennis"  # render-only presentation for videos
