# WallBallDepthCurriculumAligned — experimental serve-origin treatment
# paired with the fixed-origin WallBallDepthCurriculum control. It keeps
# stage 0 identical, then moves the serve origin with depth so the
# first-bounce distribution stays near the configured paddle start.
# The stage-3/4 scripted oracle currently fails the >=90% feasibility
# bar, so do not use this starter for a full 6M pilot yet.
# Usage: build_train_config("WallBallDepthCurriculumAligned", log_dir=..., config_file=<this file>)
# Everything here matches the recipe today; edit a value to diverge.
# Do NOT set stage-0 geometry in [env] — the gate owns it. Final
# scoring uses the aligned final-stage geometry and is therefore not
# historically comparable to fixed-origin final scores without
# cross-evaluation on both serve geometries.

[train]
total_timesteps = 6_000_000
n_envs = 8
early_stop_patience = 20  # evals without a new best before stopping

[env]
# Stage 0 keeps serve_start_x = 1.0, so control and treatment begin
# from an identical distribution. The sweep holds the paddle at each
# configured start and independently checks score/contact invariants.
serve_speed_jitter = 0.5
serve_vy_max = 2.0

# To replace the aligned ladder, uncomment ALL of the following —
# performance_gate replaces wholesale, never merges — and run paired
# baseline/aligned sweeps with common held-out seeds first.
