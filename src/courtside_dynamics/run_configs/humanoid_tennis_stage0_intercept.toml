# HumanoidTennisStage0Intercept — masked curriculum stage 0: move to
# the ball and touch it (PPO, 500k steps, single env).
# Usage: build_train_config("HumanoidTennisStage0Intercept", log_dir=...,
#                           config_file=<this file>)
# Everything here matches the recipe today; edit a value to diverge.
# Do NOT set curriculum_config in [env] — it IS the stage identity;
# use the stage-1/2 recipes to advance instead.

[train]
total_timesteps = 500_000
n_envs = 1              # the humanoid env is heavy; PPO batches locally
eval_freq = 25_000
checkpoint_freq = 100_000

[env]
episode_len = 150       # short: an intercept attempt, not a rally
