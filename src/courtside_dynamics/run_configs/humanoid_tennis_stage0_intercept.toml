# HumanoidTennisStage0Intercept — masked curriculum stage 0: move to
# the ball and touch it (PPO, 500k steps, single env).
# Usage: build_train_config("HumanoidTennisStage0Intercept", log_dir=...,
#                           config_file=<this file>)
# Everything here matches the recipe today; edit a value to diverge.
# Do NOT set curriculum_config in [env] — it IS the stage identity;
# use the stage-1/2 recipes to advance instead.

[train]
total_timesteps = 500_000
# Trained on a single-process DummyVecEnv; raising n_envs alone batches
# policy inference but adds no multi-core physics stepping.
n_envs = 1
# Earliest reachable stop is eval 2*patience (min_evals = patience), so
# patience is scaled to this stage's 20-eval budget: earliest stop at 16.
early_stop_patience = 8
# The stage reward is hand-scaled, sparse, and terminal-only; the PPO
# default (normalize returns) would amplify the first rare success
# toward the clip ceiling exactly when learning begins.
normalize_reward = false
eval_freq = 25_000
checkpoint_freq = 100_000

[env]
episode_len = 150       # short: an intercept attempt, not a rally
