# WallBallBaseline — the calibrated one-bounce rally task from the
# baseline review: pinned paddle lane, damped paddle, fined (not
# terminal) early touches and weak returns, recovery-fragment resets
# annealed by a schedule (SAC, 1.5M steps).
# Usage: build_train_config("WallBallBaseline", log_dir=..., config_file=<this file>)
# Everything here matches the recipe today; edit a value to diverge.
# (The recipe also pins eval recovery_reset_probability = 0.0 and the
# fragment-anneal schedule in code — no need to restate them here.)

[train]
total_timesteps = 1_500_000
n_envs = 8
early_stop_patience = 20  # evals without a new best before stopping
# Selection: exchange mean, tie-broken by the deep-rally tail (ge_2
# saturated at ~100% in runs 165358/023737 and stopped discriminating).
best_metric_keys = ["bounce_count_ep_mean", "bounce_count_ep_ge_5_rate"]

[train.model_kwargs]
# Deep-merged onto the recipe's bundle. gamma 0.995 gives the critic a
# ~200-step credit horizon (more than one full exchange), targeting the
# dominant double-bounce failure of run 023737. Auto-entropy stays: the
# 20260717 A/B showed fixed ent_coef was the poison, not gamma.
gamma = 0.995

[env]
# Serve difficulty. The review calibrated 2.0/0.5; widen only after
# eval bounce_count_ep_mean clears ~1.3 sustained.
serve_vy_max = 2.0
serve_speed_jitter = 0.5
serve_speed = 5.5
# Geometry/handling calibration (v0.10.0): lane in front of the serve
# landing zone, heavier paddle joint so swings don't ring.
paddle_x_target_range = [-3.2, -1.6]
paddle_home_x = -2.7
paddle_joint_damping = 8.0
# Fine (per event) for touching the ball before its floor bounce;
# "none" restores the legacy instant-termination rule.
early_touch_penalty = 0.25
# Weak returns (floor before wall) are a fined retry during training,
# converting the 12-16% terminal weak-return episodes of runs
# 165358/023737 into practice reps; "none" restores the terminal rule.
weak_return_penalty = 0.1

[eval_env]
# Scoring stays on the strict task every earlier run was measured on.
weak_return_penalty = "none"
