# WallBallBootstrap — the recommended WallBall trainer: bootstrap
# rewards (first_hit_bonus, weak_return_penalty) plus a
# performance-gated serve curriculum that widens serve_vy_max
# 1.1 -> 2.0 as eval bounce_count_ep_mean sustains >= 1.3
# (SAC, 1.5M steps; exploration model_kwargs live in the recipe).
# Usage: build_train_config("WallBallBootstrap", log_dir=..., config_file=<this file>)
# Everything here matches the recipe today; edit a value to diverge.
# Do NOT set stage-0 serve values in [env] — the gate owns them.

[train]
total_timesteps = 1_500_000
n_envs = 8

[train.model_kwargs]
# Deep-merged onto the recipe's calibrated exploration bundle
# (learning_starts=10_000, buffer_size=500_000, gamma=0.995,
# target_entropy=-1.5 all survive). The entropy floor is the single
# most likely knob: raise to "auto_0.05" if the policy goes passive
# early, lower to "auto_0.01" if late training stays jittery.
ent_coef = "auto_0.02"

[env]
# Bootstrap shaping (v0.11.0). Zero any of these out only with a
# deliberate ablation in mind — the ladder
# parked < tracker < crude swing < oracle was calibrated with them on.
first_hit_bonus = 0.25       # once per episode, kept even on failure
weak_return_penalty = 0.1    # fined retry instead of terminal floor_before_wall
early_touch_penalty = 0.25

# To replace the serve curriculum, uncomment ALL of the following —
# performance_gate replaces wholesale, never merges:
# [train.performance_gate]
# metric_key = "bounce_count_ep_mean"
# threshold = 1.3
# sustain_evals = 2
# [[train.performance_gate.stages]]
# serve_vy_max = 1.1
# serve_speed_jitter = 0.2
# [[train.performance_gate.stages]]
# serve_vy_max = 2.0
# serve_speed_jitter = 0.5
