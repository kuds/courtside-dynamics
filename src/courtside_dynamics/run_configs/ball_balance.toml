# BallBalance — keep the ball balanced on the paddle (SAC, 1M steps).
# Usage: build_train_config("BallBalance", log_dir=..., config_file=<this file>)
# Everything here matches the recipe today; edit a value to diverge.
# (docs/run_config_file_spec.md for merge semantics.)

[train]
total_timesteps = 1_000_000
n_envs = 8
early_stop_patience = 20  # evals without a new best before stopping

[train.algo.sac]
eval_freq = 25_000        # env steps (summed across workers) between evals

# The recipe uses SB3 SAC defaults; uncomment to tune (deep-merged, so
# one key at a time is safe).
# [train.algo.sac.model_kwargs]
# gamma = 0.99
# learning_rate = 3e-4

[train.algo.ppo]
# PPO evaluates every whole number of rollouts (n_steps 512 x 8 workers
# = 4,096 env steps; 8,192 at 16): 6 here.
eval_freq = 24_576

# The recipe's PPO profile (rollout 512, minibatch 256, target_kl 0.03,
# log_std_init -1, reward normalization on); uncomment to tune.
# [train.algo.ppo.model_kwargs]
# target_kl = 0.03
# learning_rate = 3e-4
