# PaddleTennis — the first two-sided rung: 1v1 cooperative rally on the
# probe-frozen 13 m paddle court (half-length 6.5 m, regulation 0.914 m
# net, wall-ball paddles verbatim) under ground rules (pre-bounce
# returns fault; docs/paddle_tennis_ground_rules_20260803.md), against
# the bounce-waiting ground oracle through the P4-verified mirror. One
# point per episode with strict serve alternation; the serve is the
# P3-measured band (origin 3.25 m, 9 m/s, 21° — 100% legal). Selection
# and success follow crossings (cumulative return crossings per
# point); the scripted ground pair's reference band is 7.78 (held-out
# certification 7.68).
# Usage: build_train_config("PaddleTennis", log_dir=..., config_file=<this file>)
# Everything here matches the recipe today; edit a value to diverge.
# (docs/run_config_file_spec.md for merge semantics.)

[train]
total_timesteps = 2_000_000
n_envs = 8
early_stop_patience = 20  # evals without a new best before stopping
eval_freq = 25_000        # steps per env between eval batches

# The recipe pins the ground-era exploration package (gSDE with a
# 64-step noise hold, auto-entropy from a raised -1.5 target;
# docs/paddle_tennis_exploration_20260808.md): use_sde=true,
# ent_coef="auto_0.02", target_entropy=-1.5, train_freq=[64, "step"].
# Other model kwargs are SB3 SAC defaults. Uncomment to tune
# (deep-merged, so one key at a time is safe).
# [train.model_kwargs]
# gamma = 0.99
# learning_rate = 3e-4

# [env]
# court_style = "tennis"  # render-only presentation for videos
