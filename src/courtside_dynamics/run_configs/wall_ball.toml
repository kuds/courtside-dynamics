# WallBall (classic) — the full serve/bounce/paddle-hit/wall rally task
# (SAC, 1.5M steps). NOTE: for new WallBall work prefer
# wall_ball_goal_rally.toml or wall_ball_true_baseline.toml (the
# current-era direct-task recipes); this classic preset predates the
# geometry calibration and is kept for comparison runs.
# Usage: build_train_config("WallBall", log_dir=..., config_file=<this file>)

[train]
total_timesteps = 1_500_000
n_envs = 8
early_stop_patience = 20  # evals without a new best before stopping

[env]
min_force = 20.0
# Lateral serve spread. 2.6 is the historical (hard) value; the
# baseline-review calibration found 2.0 more learnable.
serve_vy_max = 2.6
