[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courtside-dynamics"
dynamic = ["version"]
description = "Courtside Dynamics: a progression of MuJoCo environments toward humanoid tennis, trained with deep RL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Courtside Dynamics contributors" }]
keywords = ["reinforcement-learning", "mujoco", "tennis", "robotics", "gymnasium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mujoco>=3.3",
    "gymnasium>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.5",
    "torch>=2.3",
    "tensorboard",
    "pandas",
    "matplotlib",
    # gymnasium.envs.mujoco imports imageio during rendering but doesn't
    # declare it as a dep; pin it here so `pip install .[train]` is
    # self-sufficient.
    "imageio",
    # VecVideoRecorder requires moviepy to encode MP4s. Without it,
    # VideoRecordCallback fails with DependencyNotInstalled the first
    # time it fires.
    "moviepy",
]
notebooks = [
    "mediapy",
    "jupyter",
]
dev = [
    "pytest>=7",
    "pytest-timeout",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/kuds/rl-mujoco-tennis"
Repository = "https://github.com/kuds/rl-mujoco-tennis"

[tool.setuptools.packages.find]
where = ["src"]

# Single source of truth for the version: ``courtside_dynamics.__version__``.
# setuptools reads it statically (AST parse of the literal assignment), so the
# package isn't imported at build time and its runtime deps aren't needed then.
[tool.setuptools.dynamic]
version = { attr = "courtside_dynamics.__version__" }

[tool.setuptools.package-data]
"courtside_dynamics.assets" = ["*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py310"
# Notebooks are thin Colab drivers; their cell ordering (setup_colab before
# mujoco imports) is intentional and trips E402.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Pyflakes, pycodestyle (E/W), isort, bugbear, pyupgrade.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    # Allow non-fatal style nits that would churn the code without value.
    "E501",  # line-too-long; handled by formatter, not blocking.
]

[tool.ruff.lint.per-file-ignores]
# Notebooks / package __init__ files re-export symbols on purpose.
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
# Start permissive on annotations (most defs are untyped), but do check
# the bodies of untyped defs — catches real bugs without forcing a big
# typing refactor up front. Tighten further over time.
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/courtside_dynamics"]
