[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courtside-dynamics"
dynamic = ["version"]
description = "Courtside Dynamics: a progression of MuJoCo environments toward humanoid tennis, trained with deep RL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Courtside Dynamics contributors" }]
keywords = ["reinforcement-learning", "mujoco", "tennis", "robotics", "gymnasium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mujoco>=3.3",
    "gymnasium>=1.0",
    "numpy>=1.26",
    # Gymnasium imports these from its MuJoCo rendering module when the env
    # classes are imported, but does not declare them as core dependencies.
    "imageio",
    "packaging",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.5",
    "torch>=2.3",
    "tensorboard",
    "pandas",
    "matplotlib",
    # VecVideoRecorder requires moviepy to encode MP4s. Without it,
    # VideoRecordCallback fails with DependencyNotInstalled the first
    # time it fires.
    "moviepy",
]
notebooks = [
    # Deliberately NOT "jupyter": anywhere the notebook is *running*,
    # Jupyter already exists, so the metapackage is redundant -- and on
    # Colab it upgrades jupyter-server past google-colab's pinned
    # version, making every install cell print a pip dependency-conflict
    # error. Local users provisioning a fresh env install jupyter (or
    # jupyterlab) themselves.
    "mediapy",
]
dev = [
    "pytest>=7",
    "pytest-timeout",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/kuds/courtside-dynamics"
Repository = "https://github.com/kuds/courtside-dynamics"

[tool.setuptools.packages.find]
where = ["src"]

# Single source of truth for the version: ``courtside_dynamics.__version__``.
# setuptools reads it statically (AST parse of the literal assignment), so the
# package isn't imported at build time and its runtime deps aren't needed then.
[tool.setuptools.dynamic]
version = { attr = "courtside_dynamics.__version__" }

[tool.setuptools.package-data]
"courtside_dynamics.run_configs" = ["*.toml", "*.md"]
"courtside_dynamics.assets" = [
    "*.xml",
    "*.md",
    "robots/*.xml",
    "third_party/unitree_g1/*",
    "third_party/unitree_g1/assets/*.STL",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py311"
# Notebooks are thin Colab drivers; their cell ordering (setup_colab before
# mujoco imports) is intentional and trips E402.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Pyflakes, pycodestyle (E/W), isort, bugbear, pyupgrade.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    # Allow non-fatal style nits that would churn the code without value.
    "E501",  # line-too-long; handled by formatter, not blocking.
]

[tool.ruff.lint.per-file-ignores]
# Notebooks / package __init__ files re-export symbols on purpose.
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
# Start permissive on annotations (most defs are untyped), but do check
# the bodies of untyped defs — catches real bugs without forcing a big
# typing refactor up front. Tighten further over time.
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/courtside_dynamics"]

[[tool.mypy.overrides]]
# glfw >= 2.10.1 ships a stub written with PEP 695 `type` aliases,
# which mypy rejects under python_version = "3.11" and aborts the whole
# run ("errors prevented further checking"). We never import glfw
# directly — it is a mujoco transitive dependency — so don't follow
# into it.
module = ["glfw", "glfw.*"]
follow_imports = "skip"
# follow_imports normally only governs .py files; without this, mypy
# still parses the broken .pyi stub.
follow_imports_for_stubs = true
