[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courtside-dynamics"
version = "0.1.0"
description = "Courtside Dynamics: a progression of MuJoCo environments toward humanoid tennis, trained with deep RL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Courtside Dynamics contributors" }]
keywords = ["reinforcement-learning", "mujoco", "tennis", "robotics", "gymnasium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mujoco>=3.3",
    "gymnasium>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.5",
    "torch>=2.3",
    "tensorboard",
    "pandas",
    "matplotlib",
]
notebooks = [
    "mediapy",
    "jupyter",
]
dev = [
    "pytest>=7",
    "pytest-timeout",
]

[project.urls]
Homepage = "https://github.com/kuds/rl-mujoco-tennis"
Repository = "https://github.com/kuds/rl-mujoco-tennis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"courtside_dynamics.assets" = ["*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
