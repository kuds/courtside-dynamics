name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Every dependency is an unpinned floor and the primary distribution
  # path is a fresh pip resolve on Colab, so an upstream release can
  # break users while pushes are paused mid-campaign (the glfw-stub
  # mypy override records one such breakage). The weekly run re-resolves
  # the whole matrix between pushes; workflow_dispatch allows an
  # on-demand check after an upstream release announcement.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.5"
      - run: ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[train,dev]"
      - run: mypy

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      # Building proves the wheel builds; it does not prove it works. The
      # package ships 35 STL meshes, 7 MJCFs and 11 starter TOMLs as
      # package *data* selected by hand-written globs, and its whole
      # distribution path is `pip install git+...` on Colab. Drop a glob
      # and every env constructor fails at mj_loadXML for wheel users
      # while a source checkout -- where the files sit beside the code
      # regardless -- keeps passing the full test suite.
      #
      # Base deps only, deliberately: smoke_wheel.py avoids any import
      # path that needs the train extra, so this stays a fast check and
      # does not pull torch.
      - name: Smoke-test the built wheel
        run: |
          pip install dist/*.whl
          python tools/smoke_wheel.py

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[train,dev]"
      # -n 2 with the thread pools pinned. Measured on 4 cores: 209s
      # serial -> 88-133s. The pinning is not optional -- the same -n with
      # torch's default thread count exceeded 600s, a >3x REGRESSION,
      # because every xdist worker oversubscribes threads. That is also
      # why -n is not in addopts: a default that is catastrophic unless
      # paired with an env var does not belong there.
      - name: pytest
        if: matrix.python-version != '3.13'
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: pytest -n 2
      # One leg carries coverage so gaps stay visible in the job log
      # (pytest-cov is xdist-aware); no fail-under gate on purpose.
      - name: pytest (with coverage)
        if: matrix.python-version == '3.13'
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: >
          pytest -n 2 --cov=courtside_dynamics
          --cov-report=term-missing:skip-covered
      - name: MuJoCo rendering smoke test
        if: matrix.python-version == '3.13'
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: xvfb-run -a pytest -q tests/test_humanoid_tennis_env.py::test_rgb_array_render_smoke
