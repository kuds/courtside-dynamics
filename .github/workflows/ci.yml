name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Every dependency is an unpinned floor and the primary distribution
  # path is a fresh pip resolve on Colab, so an upstream release can
  # break users while pushes are paused mid-campaign (the glfw-stub
  # mypy override records one such breakage). The weekly run re-resolves
  # the whole matrix between pushes; workflow_dispatch allows an
  # on-demand check after an upstream release announcement.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel superseded runs on the same ref. Keyed by event too: schedule
# and workflow_dispatch runs resolve to refs/heads/main, and in a
# ref-only group the Monday cron and an in-flight push run on main
# would cancel each other, leaving a head commit with a permanently
# 'cancelled' check.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Every gating job pins its runner OS. The golden env digests reproduce
# on Ubuntu 24.04 (glibc 2.39), and the env streams still reach the OS
# math library: when GitHub moved ubuntu-latest to Ubuntu 26.04
# (glibc 2.43) between the 2026-11-09 and 2026-11-16 scheduled runs, 7
# PaddleTennis goldens failed on every Python leg with no code change,
# the py3.11 leg's numeric packages unchanged too. The pin is a declared
# stopgap, not a re-record; the non-gating golden-canary job below
# keeps measuring ubuntu-latest. See docs/DECISIONS.md, "CI pins its
# runner OS".
jobs:
  lint:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.5"
      - run: ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      # CPU torch first. PyPI's default torch wheel is the CUDA build,
      # about 2.7 GB of nvidia-* wheels that a CPU runner never uses.
      # With torch already satisfied, the editable install keeps it.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[train,dev]"
      # python -m: mypy must run in the interpreter that has numpy,
      # gymnasium and SB3. A mypy that cannot see them (a global or uv
      # tool install) passes silently under ignore_missing_imports.
      - run: python -m mypy

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      # Building proves the wheel builds; it does not prove it works. The
      # package ships its simulation assets -- STL meshes, MJCF XMLs,
      # and the starter run-config TOMLs -- as package *data* selected
      # by hand-written globs, and its whole
      # distribution path is `pip install git+...` on Colab. Drop a glob
      # and every env constructor fails at mj_loadXML for wheel users
      # while a source checkout -- where the files sit beside the code
      # regardless -- keeps passing the full test suite.
      #
      # Base deps only, deliberately: smoke_wheel.py avoids any import
      # path that needs the train extra, so this stays a fast check and
      # does not pull torch.
      - name: Smoke-test the built wheel
        run: |
          pip install dist/*.whl
          python tools/smoke_wheel.py

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # CPU torch first, as in the typecheck job.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[train,dev]"
      # -n 2 with the thread pools pinned. Measured on 4 cores: 209s
      # serial -> 88-133s. The pinning is not optional -- the same -n with
      # torch's default thread count exceeded 600s, a >3x REGRESSION,
      # because every xdist worker oversubscribes threads. That is also
      # why -n is not in addopts: a default that is catastrophic unless
      # paired with an env var does not belong there.
      - name: pytest
        if: matrix.python-version != '3.13'
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: pytest -n 2
      # One leg carries coverage so gaps stay visible in the job log
      # (pytest-cov is xdist-aware); no fail-under gate on purpose.
      - name: pytest (with coverage)
        if: matrix.python-version == '3.13'
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: >
          pytest -n 2 --cov=courtside_dynamics
          --cov-report=term-missing:skip-covered
      # !cancelled(): run even when the coverage step failed, so GL
      # rendering keeps its only CI coverage (runs #229 and #230 skipped
      # it behind the golden-digest failures).
      - name: MuJoCo rendering smoke test
        if: ${{ !cancelled() && matrix.python-version == '3.13' }}
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: xvfb-run -a pytest -q tests/test_humanoid_tennis_env.py::test_rgb_array_render_smoke

  # Not a gate: the CI golden set on the floating ubuntu-latest image,
  # checked against that image's known drift. The baseline is the set
  # of cases that move there: on Ubuntu 26.04 (glibc 2.43), measured in
  # run #231 (2026-11-27), the 7 PaddleTennis cases below and nothing
  # else. The job fails only when that set changes -- a further OS move,
  # or a recovery -- so a red canary is news. continue-on-error keeps a
  # new runner image from blocking merges; update the list and
  # docs/DECISIONS.md when it changes.
  golden-canary:
    name: golden digests (ubuntu-latest canary)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: ldd --version | head -1
      - name: Golden digests (CI set) against the known ubuntu-latest drift
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          EXPECTED_MISMATCHES: >-
            paddle_tennis/drill_feed/random
            paddle_tennis/drill_full/random
            paddle_tennis/hold/oracle
            paddle_tennis/one_point/oracle
            paddle_tennis/recipe/camper
            paddle_tennis/recipe/oracle_seed_once
            paddle_tennis/recipe/random
        run: |
          status=0
          python tools/golden_digest.py > canary.log 2>&1 || status=$?
          cat canary.log
          if ! grep -qE '^ci: [0-9]+/[0-9]+ cases match' canary.log; then
            echo "golden_digest.py did not finish (exit $status)"
            exit 1
          fi
          { grep -E '^(MISMATCH|MISSING) ' canary.log || true; } \
            | awk '{print $2}' | sort > got.txt
          printf '%s\n' $EXPECTED_MISMATCHES | sort > want.txt
          if ! diff -u want.txt got.txt; then
            echo "The ubuntu-latest golden drift changed (diff above)."
            exit 1
          fi
          echo "ubuntu-latest drift unchanged: exactly the $(wc -l < want.txt) known cases move."
